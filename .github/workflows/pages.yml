name: Website

on:
  push:
    branches: [main]
    paths: ['website/**', 'docs/media/**', 'scripts/build-website.ps1', '.github/workflows/pages.yml', 'src/DesktopPet/Assets/Pet.ico']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static website
        shell: pwsh
        run: ./scripts/build-website.ps1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/website
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
